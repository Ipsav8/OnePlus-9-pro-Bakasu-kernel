name: OnePlus 9 / 9 Pro kernel v2 (BakaSU 35257 + SUSFS v2.3.0)

on:
  workflow_dispatch:
    inputs:
      with_root:
        description: "Add BakaSU + SUSFS (false = plain baseline kernel)"
        type: boolean
        default: true
      build_image:
        description: "Actually compile (slow, ~1h). Leave off to only test the patching."
        type: boolean
        default: false
      branch:
        description: "OnePlus source branch (Android 14)"
        type: string
        default: "oneplus/sm8350_u_14.0.0_oneplus9"
      kernel_hash:
        description: "Hash from your stock kernel version"
        type: string
        default: "d2a1055adeb0"
      bakasu_ref:
        description: "BakaSU commit (516d3e87... = manager v4.2.0-rc3, code 35257)"
        type: string
        default: "516d3e87fbc986ccefdde2c2765f1700612441a9"
      susfs_repo:
        description: "SM8350 5.4 tree that already has SUSFS v2.3.0 + BakaSU hooks"
        type: string
        default: "https://github.com/aospa-vili/pixel_kernel_xiaomi_sm8350.git"
      susfs_tag:
        description: "Tag or branch of that tree to fetch"
        type: string
        default: "v2026.11.01-bakasu-susfs-nomount"
      hooks_commit:
        description: "Commit: treewide BakaSU manual hooks (applied first)"
        type: string
        default: "f60b37e13494"
      susfs_commit:
        description: "Commit: SuSFS v2.3.0 + BakaSU inline hooks (applied second)"
        type: string
        default: "84b59863f272"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev cpio zip curl git python3 libncurses5 lz4 rsync patch

      - name: Assemble the OnePlus source
        run: |
          mkdir -p $HOME/ob && cd $HOME/ob
          git clone -q --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git mods
          git clone -q --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git ksrc
          rm -rf mods/.git ksrc/.git
          rsync -aH mods/ ./ && rm -rf mods
          mkdir -p kernel/msm-5.4 && rsync -aH ksrc/ kernel/msm-5.4/ && rm -rf ksrc
          find kernel/msm-5.4 -name 'Kconfig*' -exec sed -i 's/\r$//' {} +
          echo "KDIR=$HOME/ob/kernel/msm-5.4" >> $GITHUB_ENV

      - name: Add BakaSU
        if: ${{ inputs.with_root }}
        run: |
          set -e
          cd $HOME
          git clone -q https://github.com/Baka-SU/BakaSU.git BakaSU
          git -C BakaSU checkout -q ${{ inputs.bakasu_ref }}
          git -C BakaSU log -1 --format='BakaSU at %H %s'
          cd "$KDIR"
          ln -sfn "$HOME/BakaSU/kernel" drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          python3 - << 'PYEOF'
          p = "drivers/Kconfig"
          s = open(p).read()
          if 'source "drivers/kernelsu/Kconfig"' not in s:
              i = s.rfind("endmenu")
              assert i != -1, "drivers/Kconfig has no endmenu"
              s = s[:i] + 'source "drivers/kernelsu/Kconfig"\n' + s[i:]
              open(p, "w").write(s)
              print("drivers/Kconfig: added kernelsu source line")
          PYEOF
          test -f drivers/kernelsu/Kconfig || { echo "BakaSU link is broken or has no Kconfig:"; ls -la drivers/kernelsu "$HOME/BakaSU" | head -30; exit 1; }
          echo "KernelSU linked:"; ls drivers/kernelsu/ | head -30

      - name: Cut the hook and SUSFS patches from the SM8350 tree
        if: ${{ inputs.with_root }}
        run: |
          set -e
          mkdir -p $HOME/patches
          cd $HOME
          git clone -q --depth=40 --filter=blob:none --no-checkout --branch "${{ inputs.susfs_tag }}" "${{ inputs.susfs_repo }}" susfs-src
          cd susfs-src
          git log --oneline | head -15
          EXC=(':(exclude)KernelSU' ':(exclude)drivers/kernelsu' ':(exclude)drivers/Makefile' ':(exclude)drivers/Kconfig' ':(exclude)arch/arm64/configs' ':(exclude).github' ':(exclude)anykernel' ':(exclude)localversion*' ':(exclude)*.md' ':(exclude).gitmodules')
          i=0
          for C in ${{ inputs.hooks_commit }} ${{ inputs.susfs_commit }}; do
            i=$((i+1))
            git rev-parse --verify -q "$C^{commit}" > /dev/null || { echo "commit $C not found in the fetched history"; exit 1; }
            git log -1 --format="== $C: %s" "$C"
            git diff "$C^" "$C" -- . "${EXC[@]}" > "$HOME/patches/0$i-$C.patch"
            git diff --stat "$C^" "$C" -- . "${EXC[@]}" > "$HOME/patches/0$i-$C.stat"
            echo "files in patch: $(grep -c '^diff --git' $HOME/patches/0$i-$C.patch)"
            tail -45 "$HOME/patches/0$i-$C.stat"
          done

      - name: Apply the patches (strict, then fuzzy retry for rejected hunks)
        if: ${{ inputs.with_root }}
        run: |
          set -e
          cd "$KDIR"
          retry_rejects() {
            for rej in $(find . -name '*.rej' | sort); do
              f="${rej#./}"; f="${f%.rej}"
              tmp=$(mktemp)
              printf -- '--- a/%s\n+++ b/%s\n' "$f" "$f" > "$tmp"
              tail -n +2 "$rej" >> "$tmp"
              if patch -p1 --fuzz=3 --forward --no-backup-if-mismatch -i "$tmp" > /tmp/fuzz.out 2>&1; then
                echo "FUZZY OK: $f"; rm -f "$rej"
              else
                echo "FUZZY FAILED: $f"; cat /tmp/fuzz.out | tail -8
              fi
              rm -f "$tmp" "$f.orig"
            done
          }
          for P in $(ls $HOME/patches/*.patch | sort); do
            echo "############ applying $P"
            git apply --reject --whitespace=nowarn "$P" || true
            retry_rejects
          done
          find . -name '*.orig' -delete

          # show_smap() returns int here; a bare "return;" would not compile
          python3 - << 'PYEOF'
          import re
          p = "fs/proc/task_mmu.c"
          s = open(p).read()
          st = s.find("static int show_smap(")
          if st != -1:
              en = s.find("\n}\n", st)
              body = s[st:en]
              new = re.sub(r'(\n[ \t]*)return;', r'\1return 0;', body)
              if new != body:
                  open(p, "w").write(s[:st] + new + s[en:])
                  print("task_mmu.c: fixed bare return in show_smap()")
          PYEOF

          # fs/proc/fd.c: our kernel's seq_show() differs from the donor tree, so the
          # SUSFS hunk cannot match. Rebuild the hunk around OUR seq_printf statement.
          python3 - << 'PYEOF'
          import re, os
          p = "fs/proc/fd.c"
          s = open(p).read()
          if "susfs_sus_kstat_spoof_proc_fd_seq_show(&" in s:
              print("fd.c: SUSFS block already present")
          else:
              m = re.search(r'[ \t]*seq_printf\(m,\s*"pos:.*?\);\n', s, re.S)
              assert m, "fd.c: seq_printf(pos:) not found"
              orig = m.group(0)
              def sub(txt, mnt, ino):
                  txt = txt.replace("real_mount(file->f_path.mnt)->mnt_id", mnt)
                  txt = txt.replace("file_inode(file)->i_ino", ino)
                  return txt.strip()
              kstat_print = sub(orig, "mnt_id", "ino")
              mount_print = sub(orig, "susfs_get_non_sus_mnt_id_from_mnt(mnt)", "d_backing_inode(path.dentry)->i_ino")
              head = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
              "\tif (susfs_is_current_app_uid()) {\n"
              "\t\tstruct inode *inode = file_inode(file);\n"
              "\t\tbool is_fuse = false;\n"
              "\t\tif (susfs_is_inode_sus_kstat(inode, &is_fuse)) {\n"
              "\t\t\tint mnt_id = real_mount(file->f_path.mnt)->mnt_id;\n"
              "\t\t\tunsigned long ino = inode->i_ino;\n"
              "\t\t\tsusfs_sus_kstat_spoof_proc_fd_seq_show(&mnt_id, &ino, inode->i_sb->s_dev);\n"
              "\t\t\t" + kstat_print + "\n"
              "\t\t\tgoto bypass_orig_flow;\n"
              "\t\t}\n"
              "\t}\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
              "\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tif (likely(susfs_is_current_proc_umounted())) {\n"
              "\t\tstruct mount *mnt = real_mount(file->f_path.mnt);\n"
              "\t\tif (mnt->mnt_id >= DEFAULT_KSU_MNT_ID) {\n"
              "\t\t\tstruct path path;\n"
              "\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n"
              "\t\t\tchar *dpath;\n"
              "\n"
              "\t\t\tif (!pathname)\n"
              "\t\t\t\tgoto orig_flow;\n"
              "\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n"
              "\t\t\tif (IS_ERR_OR_NULL(dpath))\n"
              "\t\t\t\tgoto out_kfree;\n"
              "\t\t\tif (kern_path(dpath, 0, &path))\n"
              "\t\t\t\tgoto out_kfree;\n"
              "\t\t\tif (!d_backing_inode(path.dentry))\n"
              "\t\t\t\tgoto out_path_put;\n"
              "\n"
              "\t\t\t" + mount_print + "\n"
              "\t\t\tpath_put(&path);\n"
              "\t\t\tkfree(pathname);\n"
              "\t\t\tgoto bypass_orig_flow;\n"
              "out_path_put:\n"
              "\t\t\tpath_put(&path);\n"
              "out_kfree:\n"
              "\t\t\tkfree(pathname);\n"
              "\t\t\tgoto orig_flow;\n"
              "\t\t}\n"
              "\t}\n"
              "\n"
              "orig_flow:\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\n")
              tail = (
              "\n"
              "#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_SUS_KSTAT)\n"
              "bypass_orig_flow:\n"
              "#endif\n"
              "\n")
              s = s[:m.start()] + head + orig + tail + s[m.end():]
              open(p, "w").write(s)
              print("fd.c: SUSFS block inserted around:", orig.strip()[:70])
          for junk in ("fs/proc/fd.c.rej", "fs/proc/fd.c.orig"):
              if os.path.exists(junk):
                  os.remove(junk)
          PYEOF

          remaining=$(find . -name '*.rej' | sort)
          if [ -n "$remaining" ]; then
            echo "STILL REJECTED (the info artifact has the full text in rejects/):"
            for f in $remaining; do echo "=========== $f ==========="; cat "$f"; done
            exit 1
          fi
          test -f fs/susfs.c && echo "fs/susfs.c present"
          test -f include/linux/susfs.h && echo "include/linux/susfs.h present"

      - name: Restore cached compiler
        id: clangcache
        uses: actions/cache@v4
        with:
          path: ~/aclang
          key: aclang-r383902b

      - name: Get the stock compiler (Android clang 11, r383902b)
        if: steps.clangcache.outputs.cache-hit != 'true'
        run: |
          BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads"
          mkdir -p $HOME/aclang
          OK=""
          # googlesource sometimes answers 503: retry the whole list a few times
          for ROUND in 1 2 3 4 5; do
            for BR in android11-qpr1-release android11-release android11-qpr2-release android11-qpr3-release master-kernel-build-2020 master-kernel-build-2021; do
              U="$BASE/$BR/clang-r383902b.tar.gz"
              echo "round $ROUND: $BR"
              rm -f /tmp/clang.tgz
              if curl -fL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/clang.tgz "$U" && gzip -t /tmp/clang.tgz; then
                OK=1; break 2
              fi
            done
            echo "all sources failed in round $ROUND, waiting 60s"
            sleep 60
          done
          [ -n "$OK" ] || { echo "No compiler download worked after 5 rounds"; exit 1; }
          tar -xzf /tmp/clang.tgz -C $HOME/aclang
          rm -f /tmp/clang.tgz
          test -x $HOME/aclang/bin/clang || { echo "clang binary missing after extract"; exit 1; }

      - name: Put the compiler on PATH
        run: |
          echo "$HOME/aclang/bin" >> $GITHUB_PATH
          $HOME/aclang/bin/clang --version | head -1

      - name: Apply the stock config (+ SUSFS options if root is on)
        run: |
          export PATH=$HOME/aclang/bin:$PATH
          cd "$KDIR"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/op9-stock.config" out/.config
          echo "-g${{ inputs.kernel_hash }}" > .scmversion
          ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          echo "ARGS=$ARGS" >> $GITHUB_ENV
          make $ARGS olddefconfig 2>&1 | tee ../../olddefconfig.log | tail -5
          printf '# CONFIG_RELR is not set\nCONFIG_OPLUS_FINGERPRINT=y\nCONFIG_OPLUS_FINGERPRINT_COMMON=y\nCONFIG_OPLUS_FINGERPRINT_QCOM=y\nCONFIG_OPLUS_FINGERPRINT_GOODIX_OPTICAL=y\nCONFIG_OPLUS_FINGERPRINT_SILEAD=y\nCONFIG_OPLUS_FINGERPRINT_JIIOV_OPTICAL=y\n' > ../../extra.fragment
          scripts/kconfig/merge_config.sh -m -O out out/.config ../../extra.fragment > /dev/null 2>&1
          if [ "${{ inputs.with_root }}" = "true" ]; then
            printf 'CONFIG_KSU=y\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_SUSFS_SUS_PATH=y\nCONFIG_KSU_SUSFS_SUS_MOUNT=y\nCONFIG_KSU_SUSFS_SUS_KSTAT=y\nCONFIG_KSU_SUSFS_SUS_SU=n\nCONFIG_KSU_SUSFS_TRY_UMOUNT=y\nCONFIG_KSU_SUSFS_SPOOF_UNAME=y\nCONFIG_KSU_SUSFS_ENABLE_LOG=y\nCONFIG_KSU_SUSFS_OPEN_REDIRECT=y\nCONFIG_KSU_SUSFS_SUS_MAP=y\n' > ../../susfs.fragment
            scripts/kconfig/merge_config.sh -m -O out out/.config ../../susfs.fragment > /dev/null 2>&1
          fi
          make $ARGS olddefconfig 2>&1 | tee -a ../../olddefconfig.log | tail -5
          KREL=$(make $ARGS -s kernelrelease 2>/dev/null | tail -n 1)
          [ -n "$KREL" ] || { echo "could not read kernelrelease"; exit 1; }
          echo "KREL=$KREL" >> $GITHUB_ENV
          {
            echo "## Kernel release this build would report"
            make $ARGS -s kernelrelease 2>&1 | tail -1
            echo "## Stock release: 5.4.254-qgki-g${{ inputs.kernel_hash }}"
            echo "## Fingerprint / RELR / LTO / CFI / modversions now"
            grep -E 'FINGERPRINT|RELR|LTO_CLANG|CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|KPROBES' out/.config
          } | tee -a $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.with_root }}" = "true" ]; then
            grep -E "^CONFIG_KSU(_SUSFS)?=y" out/.config || { echo "KSU/SUSFS CONFIG DID NOT STICK:"; grep -i ksu out/.config | head -30; exit 1; }
          fi

      - name: Compile the kernel
        if: ${{ inputs.build_image }}
        run: |
          export PATH=$HOME/aclang/bin:$PATH
          cd "$KDIR"
          set -o pipefail
          make -k -j$(nproc) $ARGS Image.gz 2>&1 | tee ../../build.log | tail -5

      - name: Show the real error
        if: failure()
        run: |
          cd $HOME/ob
          grep -nE "error:|Error [0-9]+|undefined|can't open|No such file" build.log olddefconfig.log 2>/dev/null | head -30

      - name: Package with AnyKernel3
        if: ${{ inputs.build_image }}
        run: |
          set -e
          # the built image must report exactly the release we expect
          zcat "$KDIR/out/arch/arm64/boot/Image.gz" | grep -a -q "Linux version $KREL " || { echo "Built image does not report $KREL"; exit 1; }
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          cp "$KDIR/out/arch/arm64/boot/Image.gz" ak3/
          cat > ak3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=OnePlus 9 / 9 Pro BakaSU + SUSFS kernel (@KREL@)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lemonadep
          device.name2=lemonade
          device.name3=OnePlus9Pro
          device.name4=OnePlus9
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;

          # ---- bootloop guard: only flash over a boot image with the same kernel release ----
          EXPECTED="@KREL@";
          SPLIT="${split_img:-$home/split_img}";
          CUR="";
          for f in "$SPLIT"/kernel*; do
            [ -f "$f" ] || continue;
            CUR=$(grep -a -o 'Linux version [0-9][^ ]*' "$f" 2>/dev/null | head -n 1 | cut -d' ' -f3);
            [ -n "$CUR" ] || CUR=$(gzip -dc "$f" 2>/dev/null | grep -a -o 'Linux version [0-9][^ ]*' | head -n 1 | cut -d' ' -f3);
            [ -n "$CUR" ] && break;
          done;
          ui_print " ";
          ui_print "Installed kernel: ${CUR:-unknown}";
          ui_print "This package:     $EXPECTED";
          if [ "$CUR" != "$EXPECTED" ]; then
            if [ -f /sdcard/force_kernel_flash ] || [ -f /data/media/0/force_kernel_flash ]; then
              ui_print "WARNING: kernel mismatch ignored (force_kernel_flash file found)";
            else
              abort "Kernel version mismatch. The stock modules may not load and the phone could bootloop. Use a package built for this exact OxygenOS version. Nothing was changed.";
            fi;
          fi;

          # best-effort backup of the current boot partition (only when storage is mounted)
          if [ -d /sdcard/Download ] && [ -n "$block" ]; then
            BK=/sdcard/Download/boot_backup_$(date +%Y%m%d_%H%M%S).img;
            dd if="$block" of="$BK" bs=1048576 2>/dev/null && ui_print "Backed up current boot to $BK" || ui_print "Boot backup skipped";
          fi;

          write_boot;
          AKEOF
          sed -i "s|@KREL@|$KREL|g" ak3/anykernel.sh
          grep -n "KREL\|Linux version" ak3/anykernel.sh | head
          if [ "${{ inputs.with_root }}" = "true" ]; then N=OP9-BakaSU-SUSFS-kernel; else N=OP9-baseline-kernel; fi
          echo "ZIPNAME=$N" >> $GITHUB_ENV
          cd ak3 && zip -r9 ../$N.zip . -x '.git*'

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_image }}
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}.zip

      - name: Collect results
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/results
          cp "$KDIR/out/.config" $GITHUB_WORKSPACE/results/final.config 2>/dev/null || true
          cp $HOME/ob/olddefconfig.log $HOME/ob/build.log $GITHUB_WORKSPACE/results/ 2>/dev/null || true
          mkdir -p $GITHUB_WORKSPACE/results/rejects
          (cd "$KDIR" 2>/dev/null && find . -name '*.rej' | while read -r r; do cp "$r" "$GITHUB_WORKSPACE/results/rejects/$(echo "$r" | sed 's|^\./||; s|/|__|g')"; done) || true
          cp $HOME/patches/*.patch $GITHUB_WORKSPACE/results/ 2>/dev/null || true
          cp $HOME/patches/*.stat $GITHUB_WORKSPACE/results/ 2>/dev/null || true
          ls -l $GITHUB_WORKSPACE/results 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op9-bakasu-build-info
          include-hidden-files: true
          path: results/
          if-no-files-found: ignore

- name: Hand fixes for the rejected spots
        if: ${{ inputs.with_root }}
        run: |
          set -e
          cd "$KDIR"
          python3 - << 'PYEOF'
          import re

          def edit(path, fn):
              s = open(path).read()
              n = fn(s)
              if n is None:
                  print("ALREADY DONE:", path)
                  return
              open(path, "w").write(n)
              print("EDITED:", path)

          def kconfig(s):
              if 'source "drivers/kernelsu/Kconfig"' in s:
                  return None
              idx = s.rfind("endmenu")
              assert idx != -1, "drivers/Kconfig has no endmenu"
              return s[:idx] + 'source "drivers/kernelsu/Kconfig"\n' + s[idx:]

          def namespace(s):
              if "#include <linux/susfs_def.h>" in s:
                  return None
              inc = "#include <linux/shmem_fs.h>\n"
              assert inc in s, "namespace.c include anchor not found"
              s = s.replace(inc, inc +
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif\n", 1)
              a = "/* Maximum number of mounts in a mount namespace */\n"
              assert a in s, "namespace.c comment anchor not found"
              ext = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "extern bool susfs_is_current_ksu_domain(void);\n"
                     "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n")
              if "define CL_COPY_MNT_NS" not in s:
                  ext += "#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n\n"
              ext += "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"
              return s.replace(a, ext + a, 1)

          def task_mmu(s):
              if "#include <linux/susfs_def.h>" in s:
                  return None
              anchor = "#include <asm/elf.h>\n"
              assert anchor in s, "task_mmu.c anchor not found"
              blk = ("#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                     "#include <linux/susfs_def.h>\n"
                     "#endif\n")
              return s.replace(anchor, blk + anchor, 1)

          def fdc(s):
              if "susfs_get_non_sus_mnt_id_from_mnt" in s:
                  return None
              m = re.search(r'[ \t]*seq_printf\(m,\s*"pos:.*?\);\n', s, re.S)
              assert m, "seq_printf(pos:) not found in fs/proc/fd.c"
              orig = m.group(0)
              spoof = (orig
                  .replace("real_mount(file->f_path.mnt)->mnt_id",
                           "susfs_get_non_sus_mnt_id_from_mnt(mnt)")
                  .replace("file_inode(file)->i_ino",
                           "path.dentry->d_inode->i_ino"))
              assert spoof != orig, "fd.c seq_printf has unexpected arguments"
              head = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                      "\t{\n"
                      "\t\tstruct mount *mnt = real_mount(file->f_path.mnt);\n"
                      "\n"
                      "\t\tif (mnt->mnt_id >= DEFAULT_KSU_MNT_ID &&\n"
                      "\t\t    likely(susfs_is_current_proc_umounted())) {\n"
                      "\t\t\tstruct path path;\n"
                      "\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n"
                      "\t\t\tchar *dpath;\n"
                      "\n"
                      "\t\t\tif (pathname) {\n"
                      "\t\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n"
                      "\t\t\t\tif (!IS_ERR_OR_NULL(dpath) && !kern_path(dpath, 0, &path)) {\n"
                      "\t\t\t\t\tif (path.dentry->d_inode) {\n")
              mid = ("\t\t\t\t\t\tpath_put(&path);\n"
                     "\t\t\t\t\t\tkfree(pathname);\n"
                     "\t\t\t\t\t\tgoto bypass_orig_flow;\n"
                     "\t\t\t\t\t}\n"
                     "\t\t\t\t\tpath_put(&path);\n"
                     "\t\t\t\t}\n"
                     "\t\t\t\tkfree(pathname);\n"
                     "\t\t\t}\n"
                     "\t\t}\n"
                     "\t}\n"
                     "#endif\n")
              tail = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                      "bypass_orig_flow:\n"
                      "#endif\n")
              return s[:m.start()] + head + spoof + mid + orig + tail + s[m.end():]

          edit("drivers/Kconfig", kconfig)
          edit("fs/namespace.c", namespace)
          edit("fs/proc/task_mmu.c", task_mmu)
          edit("fs/proc/fd.c", fdc)
          PYEOF

          # the three rejected files are handled by hand above
          unexpected=0
          for rej in $(find . -name '*.rej' | sort); do
            case "$rej" in
              ./fs/namespace.c.rej|./fs/proc/fd.c.rej|./fs/proc/task_mmu.c.rej) rm -f "$rej" ;;
              *) echo "UNEXPECTED REJECT: $rej"; cat "$rej"; unexpected=1 ;;
            esac
          done
          [ "$unexpected" = 0 ] || exit 1
          find . -name '*.orig' -delete

          grep -q susfs_get_non_sus_mnt_id_from_mnt fs/proc/fd.c
          grep -q 'linux/susfs_def.h' fs/proc/task_mmu.c
          grep -q 'define CL_COPY_MNT_NS' fs/namespace.c
          test -f fs/susfs.c && echo "fs/susfs.c present"

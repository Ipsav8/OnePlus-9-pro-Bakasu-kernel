name: OnePlus 9 Pro kernel (BakaSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      with_root:
        description: "Add BakaSU + SUSFS (false = plain baseline kernel)"
        type: boolean
        default: true
      build_image:
        description: "Actually compile (slow, ~1h). Leave off to only test the setup."
        type: boolean
        default: false
      branch:
        description: "OnePlus source branch (Android 14)"
        type: string
        default: "oneplus/sm8350_u_14.0.0_oneplus9"
      kernel_hash:
        description: "Hash from your stock kernel version"
        type: string
        default: "d2a1055adeb0"
      bakasu_ref:
        description: "BakaSU commit (003ef467 = closest match to SUSFS v2.2.0)"
        type: string
        default: "003ef467"
      feather_commit:
        description: "Feather commit that added SUSFS v2.2.0 + inline hooks"
        type: string
        default: "d9b6667ccd09"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev cpio zip curl git python3 libncurses5 lz4 rsync

      - name: Assemble the OnePlus source
        run: |
          mkdir -p $HOME/ob && cd $HOME/ob
          git clone -q --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git mods
          git clone -q --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git ksrc
          rm -rf mods/.git ksrc/.git
          rsync -aH mods/ ./ && rm -rf mods
          mkdir -p kernel/msm-5.4 && rsync -aH ksrc/ kernel/msm-5.4/ && rm -rf ksrc
          find kernel/msm-5.4 -name 'Kconfig*' -exec sed -i 's/\r$//' {} +
          echo "KDIR=$HOME/ob/kernel/msm-5.4" >> $GITHUB_ENV

      - name: Add BakaSU
        if: ${{ inputs.with_root }}
        run: |
          set -e
          cd $HOME
          git clone -q https://github.com/Baka-SU/BakaSU.git BakaSU
          git -C BakaSU checkout -q ${{ inputs.bakasu_ref }}
          cd "$KDIR"
          ln -sfn ../../../BakaSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          echo "KernelSU linked:"; ls drivers/kernelsu/ | head -5

      - name: Cut and apply the Feather SUSFS patch
        if: ${{ inputs.with_root }}
        run: |
          set -e
          cd $HOME
          git clone -q --filter=blob:none --no-checkout https://github.com/one899/Feather-Kernel-SM8350.git feather
          cd feather
          C=${{ inputs.feather_commit }}
          git diff $C^ $C -- . ':(exclude)KernelSU' ':(exclude)anykernel' ':(exclude).github' ':(exclude)arch/arm64/configs' ':(exclude)localversion*' ':(exclude)drivers/Kconfig' ':(exclude)drivers/Makefile' ':(exclude)drivers/kernelsu' > $HOME/feather-susfs.patch
          echo "patch files: $(grep -c '^diff --git' $HOME/feather-susfs.patch)"
          cd "$KDIR"
          git apply --reject --whitespace=nowarn $HOME/feather-susfs.patch || true
          find . -name '*.rej' | sort

      - name: Hand fixes for the 4 rejected spots
        if: ${{ inputs.with_root }}
        run: |
          set -e
          cd "$KDIR"
          python3 - << 'PYEOF'
          def edit(path, fn):
              s = open(path).read()
              n = fn(s)
              if n is None:
                  print("ALREADY DONE:", path)
                  return
              open(path, "w").write(n)
              print("EDITED:", path)

          def kconfig(s):
              if 'source "drivers/kernelsu/Kconfig"' in s:
                  return None
              idx = s.rfind("endmenu")
              assert idx != -1, "drivers/Kconfig has no endmenu"
              return s[:idx] + 'source "drivers/kernelsu/Kconfig"\n' + s[idx:]

          def namespace(s):
              if "susfs_is_current_ksu_domain" in s:
                  return None
              inc = "#include <linux/shmem_fs.h>\n"
              assert inc in s, "namespace.c include anchor not found"
              s = s.replace(inc, inc +
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif\n", 1)
              a = "/* Maximum number of mounts in a mount namespace */\n"
              assert a in s, "namespace.c comment anchor not found"
              ext = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "extern bool susfs_is_current_ksu_domain(void);\n"
                  "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n"
                  "\n"
                  "#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n"
                  "\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"
              )
              return s.replace(a, ext + a, 1)

          def fd(s):
              if "SUSFS_IS_INODE_OPEN_REDIRECT" in s:
                  return None
              old = (
                  '\tseq_printf(m, "pos:\\t%lli\\nflags:\\t0%o\\nmnt_id:\\t%i\\nino:\\t%lu\\n",\n'
                  '\t\t   (long long)file->f_pos, f_flags,\n'
                  '\t\t   real_mount(file->f_path.mnt)->mnt_id,\n'
                  '\t\t   file_inode(file)->i_ino);\n'
                  '\n'
                  '\tshow_fd_locks(m, file, files);\n'
              )
              assert old in s, "proc/fd.c anchor not found"
              susfs_block = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tmnt = real_mount(file->f_path.mnt);\n"
                  "\tif (mnt->mnt_id >= DEFAULT_KSU_MNT_ID &&\n"
                  "\t\tlikely(susfs_is_current_proc_umounted()))\n"
                  "\t{\n"
                  "\t\tstruct path path;\n"
                  "\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n"
                  "\t\tchar *dpath;\n"
                  "\n"
                  "\t\tif (!pathname) {\n"
                  "\t\t\tgoto orig_flow;\n"
                  "\t\t}\n"
                  "\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n"
                  "\t\tif (!dpath) {\n"
                  "\t\t\tgoto out_kfree;\n"
                  "\t\t}\n"
                  "\t\tif (kern_path(dpath, 0, &path)) {\n"
                  "\t\t\tgoto out_kfree;\n"
                  "\t\t}\n"
                  "\t\tif (!path.dentry->d_inode) {\n"
                  "\t\t\tgoto out_path_put;\n"
                  "\t\t}\n"
                  "\n"
                  '\t\tseq_printf(m, "pos:\\t%lli\\nflags:\\t0%o\\nmnt_id:\\t%i\\nino:\\t%lu\\n",\n'
                  "\t\t\t\t(long long)file->f_pos, f_flags,\n"
                  "\t\t\t\tsusfs_get_non_sus_mnt_id_from_mnt(mnt),\n"
                  "\t\t\t\tpath.dentry->d_inode->i_ino);\n"
                  "\t\tpath_put(&path);\n"
                  "\t\tkfree(pathname);\n"
                  "\t\tgoto bypass_orig_flow;\n"
                  "out_path_put:\n"
                  "\t\tpath_put(&path);\n"
                  "out_kfree:\n"
                  "\t\tkfree(pathname);\n"
                  "\t\tgoto orig_flow;\n"
                  "\t}\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\n"
                  "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                  "\tif (SUSFS_IS_INODE_OPEN_REDIRECT(file_inode(file))) {\n"
                  "\t\tif (susfs_open_redirect_spoof_seq_show(file_inode(file), &mnt_id, &ino))\n"
                  "\t\t\tgoto orig_flow;\n"
                  '\t\tseq_printf(m, "pos:\\t%lli\\nflags:\\t0%o\\nmnt_id:\\t%i\\nino:\\t%lu\\n",\n'
                  "\t\t\t\t(long long)file->f_pos, f_flags,\n"
                  "\t\t\t\tmnt_id,\n"
                  "\t\t\t\tino);\n"
                  "\t\tgoto bypass_orig_flow;\n"
                  "\t}\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                  "\n"
                  "#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "orig_flow:\n"
                  '\tseq_printf(m, "pos:\\t%lli\\nflags:\\t0%o\\nmnt_id:\\t%i\\nino:\\t%lu\\n",\n'
                  "\t\t   (long long)file->f_pos, f_flags,\n"
                  "\t\t   real_mount(file->f_path.mnt)->mnt_id,\n"
                  "\t\t   file_inode(file)->i_ino);\n"
                  "bypass_orig_flow:\n"
                  "#else\n"
                  '\tseq_printf(m, "pos:\\t%lli\\nflags:\\t0%o\\nmnt_id:\\t%i\\nino:\\t%lu\\n",\n'
                  "\t\t   (long long)file->f_pos, f_flags,\n"
                  "\t\t   real_mount(file->f_path.mnt)->mnt_id,\n"
                  "\t\t   file_inode(file)->i_ino);\n"
                  "#endif // #if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "\n"
                  "\tshow_fd_locks(m, file, files);\n"
              )
              return s.replace(old, susfs_block, 1)

          def task_mmu(s):
              if "CONFIG_KSU_SUSFS_SUS_KSTAT" in s and "mm_inline.h" in s:
                  if "susfs_def.h" in s:
                      return None
              inc = "#include <linux/ctype.h>\n"
              assert inc in s, "task_mmu.c anchor not found"
              ext = (
                  "#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif // #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
              )
              return s.replace(inc, inc + ext, 1)

          edit("drivers/Kconfig", kconfig)
          edit("fs/namespace.c", namespace)
          edit("fs/proc/fd.c", fd)
          edit("fs/proc/task_mmu.c", task_mmu)
          PYEOF
          find . -name '*.rej' -delete
          find . -name '*.orig' -delete
          test -f fs/susfs.c && echo "fs/susfs.c present"

      - name: Get the stock compiler (Android clang 11, r383902b)
        run: |
          BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads"
          FOUND=""
          for BR in android11-qpr1-release android11-release android11-qpr2-release android11-qpr3-release master-kernel-build-2020 master-kernel-build-2021; do
            U="$BASE/$BR/clang-r383902b.tar.gz"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 "$U")
            echo "$BR -> HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "206" ]; then FOUND="$U"; break; fi
          done
          [ -n "$FOUND" ] || { echo "No compiler download worked"; exit 1; }
          mkdir -p $HOME/aclang
          curl -fL "$FOUND" | tar -xz -C $HOME/aclang
          echo "$HOME/aclang/bin" >> $GITHUB_PATH

      - name: Apply the stock config (+ SUSFS options if root is on)
        run: |
          export PATH=$HOME/aclang/bin:$PATH
          cd "$KDIR"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/op9-stock.config" out/.config
          echo "-g${{ inputs.kernel_hash }}" > .scmversion
          ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          echo "ARGS=$ARGS" >> $GITHUB_ENV
          make $ARGS olddefconfig 2>&1 | tee ../../olddefconfig.log | tail -5
          printf '# CONFIG_RELR is not set\nCONFIG_OPLUS_FINGERPRINT=y\nCONFIG_OPLUS_FINGERPRINT_COMMON=y\nCONFIG_OPLUS_FINGERPRINT_QCOM=y\nCONFIG_OPLUS_FINGERPRINT_GOODIX_OPTICAL=y\nCONFIG_OPLUS_FINGERPRINT_SILEAD=y\nCONFIG_OPLUS_FINGERPRINT_JIIOV_OPTICAL=y\n' > ../../extra.fragment
          scripts/kconfig/merge_config.sh -m -O out out/.config ../../extra.fragment > /dev/null 2>&1
          if [ "${{ inputs.with_root }}" = "true" ]; then
            printf 'CONFIG_KSU=y\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_SUSFS_SUS_PATH=y\nCONFIG_KSU_SUSFS_SUS_MOUNT=y\nCONFIG_KSU_SUSFS_SUS_KSTAT=y\nCONFIG_KSU_SUSFS_SUS_SU=n\nCONFIG_KSU_SUSFS_TRY_UMOUNT=y\nCONFIG_KSU_SUSFS_SPOOF_UNAME=y\nCONFIG_KSU_SUSFS_ENABLE_LOG=y\nCONFIG_KSU_SUSFS_OPEN_REDIRECT=y\nCONFIG_KSU_SUSFS_SUS_MAP=y\n' > ../../susfs.fragment
            scripts/kconfig/merge_config.sh -m -O out out/.config ../../susfs.fragment > /dev/null 2>&1
          fi
          make $ARGS olddefconfig 2>&1 | tee -a ../../olddefconfig.log | tail -5
          {
            echo "## Kernel release this build would report"
            make $ARGS -s kernelrelease 2>&1 | tail -1
            echo "## Stock release: 5.4.254-qgki-g${{ inputs.kernel_hash }}"
            echo "## Fingerprint / RELR / LTO / CFI / modversions now"
            grep -E 'FINGERPRINT|RELR|LTO_CLANG|CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|KPROBES' out/.config
          } | tee -a $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.with_root }}" = "true" ]; then
            grep -E "^CONFIG_KSU(_SUSFS)?=y" out/.config || { echo "KSU/SUSFS CONFIG DID NOT STICK:"; grep -i ksu out/.config | head -30; exit 1; }
          fi

      - name: Compile the kernel
        if: ${{ inputs.build_image }}
        run: |
          export PATH=$HOME/aclang/bin:$PATH
          cd "$KDIR"
          set -o pipefail
          make -j$(nproc) $ARGS Image.gz 2>&1 | tee ../../build.log | tail -5

      - name: Show the real error
        if: failure()
        run: |
          cd $HOME/ob
          grep -nE "error:|Error [0-9]+|undefined|can't open|No such file" build.log olddefconfig.log 2>/dev/null | head -30

      - name: Package with AnyKernel3
        if: ${{ inputs.build_image }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          cp "$KDIR/out/arch/arm64/boot/Image.gz" ak3/
          cat > ak3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=OnePlus 9 Pro BakaSU + SUSFS kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lemonadep
          device.name2=lemonade
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF
          if [ "${{ inputs.with_root }}" = "true" ]; then N=OP9-BakaSU-SUSFS-kernel; else N=OP9-baseline-kernel; fi
          echo "ZIPNAME=$N" >> $GITHUB_ENV
          cd ak3 && zip -r9 ../$N.zip . -x '.git*'

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_image }}
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}.zip

      - name: Collect results
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/results
          cp "$KDIR/out/.config" $GITHUB_WORKSPACE/results/final.config 2>/dev/null || true
          cp $HOME/ob/olddefconfig.log $HOME/ob/build.log $GITHUB_WORKSPACE/results/ 2>/dev/null || true
          ls -l $GITHUB_WORKSPACE/results 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op9-bakasu-build-info
          include-hidden-files: true
          path: results/
          if-no-files-found: ignore

name: OnePlus 9 SUSFS scout 2 (Feather patch + BakaSU match, no compile)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "OnePlus source branch (Android 14)"
        type: string
        default: "oneplus/sm8350_u_14.0.0_oneplus9"
      feather_commit:
        description: "Feather commit that added SUSFS v2.2.0 + inline hooks"
        type: string
        default: "d9b6667ccd09"

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-22.04
    steps:
      - name: Assemble the OnePlus source (same as the baseline build)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          mkdir -p $HOME/ob && cd $HOME/ob
          git clone -q --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git mods
          git clone -q --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git ksrc
          rm -rf mods/.git ksrc/.git
          rsync -aH mods/ ./ && rm -rf mods
          mkdir -p kernel/msm-5.4 && rsync -aH ksrc/ kernel/msm-5.4/ && rm -rf ksrc
          find kernel/msm-5.4 -name 'Kconfig*' -exec sed -i 's/\r$//' {} +
          echo "KDIR=$HOME/ob/kernel/msm-5.4" >> $GITHUB_ENV

      - name: Cut the SUSFS patch out of the Feather kernel
        run: |
          cd $HOME
          git clone -q --filter=blob:none --no-checkout https://github.com/one899/Feather-Kernel-SM8350.git feather
          cd feather
          C=${{ inputs.feather_commit }}
          {
            echo "## Files changed by Feather commit $C"
            git show --stat --format='%h %ad %s' --date=short $C | tail -n +1 | head -70
          } | tee -a $GITHUB_STEP_SUMMARY
          git diff $C^ $C -- . ':(exclude)KernelSU' ':(exclude)anykernel' ':(exclude).github' ':(exclude)arch/arm64/configs' ':(exclude)localversion*' > $HOME/feather-susfs.patch
          echo "patch size: $(wc -c < $HOME/feather-susfs.patch) bytes, files: $(grep -c '^diff --git' $HOME/feather-susfs.patch)" | tee -a $GITHUB_STEP_SUMMARY

      - name: Try that patch on the OnePlus 9 source
        run: |
          cd "$KDIR"
          git apply --reject --whitespace=nowarn $HOME/feather-susfs.patch > $HOME/apply-feather.log 2>&1 || true
          {
            echo "## Feather SUSFS patch on the OnePlus 9 source"
            echo "files with rejected pieces: $(find . -name '*.rej' | wc -l)"
            find . -name '*.rej' | sort | head -40
            echo "files missing: $(grep -c 'No such file' $HOME/apply-feather.log)"
          } | tee -a $GITHUB_STEP_SUMMARY

      - name: Which BakaSU commit fits SUSFS 2.2.0
        run: |
          cd $HOME
          git clone -q https://github.com/Baka-SU/BakaSU.git BakaSU
          cd BakaSU
          python3 - << 'PYEOF'
          import re, subprocess, os
          home = os.environ["HOME"]
          rx = re.compile(r"\bsusfs_[a-z0-9_]+")
          def run(args, cwd):
              return subprocess.run(args, cwd=cwd, capture_output=True, text=True, errors="ignore").stdout
          fdir = home + "/feather"
          defs = set()
          for path in ("include/linux/susfs.h", "include/linux/susfs_def.h", "fs/susfs.c"):
              defs |= set(rx.findall(run(["git", "show", "HEAD:" + path], fdir)))
          commits = run(["git", "log", "--format=%h|%ad|%s", "--date=short", "-n", "250", "--", "kernel"], home + "/BakaSU").splitlines()
          rows = []
          for line in commits:
              h, d, s = line.split("|", 2)
              out = run(["git", "grep", "-h", "-o", "-E", r"\bsusfs_[a-z0-9_]+", h, "--", "kernel"], home + "/BakaSU")
              used = set(rx.findall(out))
              rows.append((len(used - defs), h, d, s[:60], len(used)))
          rows.sort()
          lines = ["## BakaSU commits, best SUSFS-2.2.0 match first (lower = better)"]
          lines += ["missing %d of %d | %s %s | %s" % (m, u, h, d, s) for m, h, d, s, u in rows[:10]]
          lines += ["## For comparison, newest commits"]
          lines += ["missing %d of %d | %s %s | %s" % (m, u, h, d, s) for m, h, d, s, u in sorted(rows, key=lambda r: r[2], reverse=True)[:3]]
          text = "\n".join(lines)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          print(text)
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: susfs-feather-patch
          path: |
            /home/runner/feather-susfs.patch
            /home/runner/apply-feather.log
          if-no-files-found: ignore

name: OnePlus 9 scout (no compile)

on:
  workflow_dispatch:
    inputs:
      kernel_hash:
        description: "Hash from your kernel version (5.4.254-qgki-g<hash>)"
        type: string
        default: "d2a1055adeb0"
      branch:
        description: "OnePlus source branch (Android 14)"
        type: string
        default: "oneplus/sm8350_u_14.0.0_oneplus9"

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-22.04
    steps:
      - name: Is your kernel commit in OnePlus's source?
        run: |
          for repo in OnePlusOSS/android_kernel_oneplus_sm8350 OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350; do
            echo "== $repo" | tee -a $GITHUB_STEP_SUMMARY
            curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/$repo/commits/${{ inputs.kernel_hash }}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('commit:', d.get('sha') or d.get('message'))" | tee -a $GITHUB_STEP_SUMMARY
          done

      - name: Android 14 branches
        run: |
          git ls-remote --heads https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git | sed 's|.*refs/heads/||' | grep -iE "_u_|14" | head -30 | tee -a $GITHUB_STEP_SUMMARY

      - name: Look inside the Android 14 source
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git src
          cd src
          {
            echo "## Top level"; ls | head -20
            echo "## Makefile version lines"
            for f in $(find . -maxdepth 4 -name Makefile -path '*msm-5.4*' | head -1); do echo "$f"; head -6 "$f"; done
            echo "## Defconfigs"
            find . -name 'lahaina*defconfig' | head -10
            echo "## build.config"
            find . -name 'build.config*lemon*' | head -5
          } | tee -a $GITHUB_STEP_SUMMARY
          CFG=$(find . -name 'lahaina-qgki_defconfig' | head -1)
          if [ -n "$CFG" ]; then
            {
              echo "## Key options in $CFG"
              grep -E "LOCALVERSION|KPROBES|MODVERSIONS|MODULE_SIG|LTO|CFI|OVERLAY_FS|FUSE|SDCARD|KSU|SUSFS" "$CFG" | head -40
            } | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: SUSFS and BakaSU versions that exist
        run: |
          {
            echo "## SUSFS branches (official)"
            git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git | sed 's|.*refs/heads/||' | head -30
            echo "## BakaSU head"
            git ls-remote https://github.com/Baka-SU/BakaSU.git HEAD
          } | tee -a $GITHUB_STEP_SUMMARY
